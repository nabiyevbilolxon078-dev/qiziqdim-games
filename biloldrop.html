<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Biloldrop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===================================================================
     BILOLDROP — grafit, laym va binafsha. O'z dizayni.
     =================================================================== */
  :root {
    --bg: #0b0d12; --panel: #141720; --panel-2: #1b1f2b; --panel-3: #252a3a;
    --line: rgba(238, 241, 247, .07); --text: #eef1f7; --muted: #959cb3; --faint: #6d748c;
    --lime: #c4ff3d; --lime-ink: #182000; --violet: #8b6cff; --red: #ff4d5e; --gold: #ffc542; --green: #3fd27c;
    --r: 16px; --ease: cubic-bezier(.16, 1, .3, 1);
    --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Unbounded", "Manrope", system-ui, sans-serif;
    --shadow: 0 12px 28px -14px rgba(0, 0, 0, .9);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font: 600 15px var(--font); overscroll-behavior: none; user-select: none; -webkit-user-select: none; font-variant-numeric: tabular-nums; caret-color: var(--lime); }
  ::selection { background: var(--lime); color: var(--lime-ink); }
  ::-webkit-scrollbar { width: 0; height: 0; }
  :focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }

  /* ---------- Yuqori panel ---------- */
  .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(11, 13, 18, .92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .home-btn { width: 38px; height: 38px; border: 0; border-radius: 12px; background: var(--panel-2); color: var(--text); display: grid; place-items: center; flex: none; }
  .home-btn svg { width: 19px; height: 19px; }
  .logo { display: flex; align-items: center; gap: 8px; font: 800 17px var(--display); letter-spacing: -0.02em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; }
  .bal { flex: none; }
  @media (max-width: 380px) { .logo { font-size: 14px; gap: 6px; } .bal { font-size: 12px; } }
  html, body { overflow-x: hidden; }
  .logo .mk { width: 26px; height: 26px; border-radius: 8px; background: var(--lime); display: grid; place-items: center; transform: rotate(-8deg); }
  .logo .mk svg { width: 16px; height: 16px; }
  .logo b { color: var(--lime); font-weight: 800; }
  .bal { display: flex; align-items: center; gap: 6px; background: var(--panel-2); border-radius: 12px; padding: 4px 4px 4px 12px; font: 700 13px var(--display); white-space: nowrap; }
  .bal button { width: 30px; height: 30px; border: 0; border-radius: 9px; background: var(--lime); color: var(--lime-ink); font-size: 20px; font-weight: 800; line-height: 1; }

  /* ---------- Jonli tushumlar ---------- */
  .live { display: flex; gap: 6px; overflow: hidden; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  .live .lv { flex: 0 0 96px; height: 76px; border-radius: 12px; position: relative; overflow: hidden; padding: 5px 7px; background: linear-gradient(160deg, color-mix(in oklab, var(--rc) 34%, var(--panel)), var(--panel) 75%); animation: lvIn .5s var(--ease); }
  .live .lv img { position: absolute; right: -2px; top: 14px; width: 84px; height: 48px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
  .live .lv .u { font-size: 9.5px; color: var(--muted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
  .live .lv .u.me { color: var(--lime); }
  .live .lv .n { position: absolute; left: 7px; right: 7px; bottom: 4px; font-size: 9.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @keyframes lvIn { from { transform: translateX(-30px) scale(.9); opacity: 0; } }
  .live-cap { padding: 8px 14px 0; font-size: 11px; color: var(--faint); font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .live-cap i { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  main { padding: 14px 14px calc(96px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  main.enter { animation: pageIn .35s var(--ease); }
  @keyframes pageIn { from { opacity: 0; transform: translateY(10px); } }
  h2 { font: 700 22px var(--display); letter-spacing: -0.02em; margin: 6px 0 12px; }
  h3 { font: 700 16px var(--display); letter-spacing: -0.01em; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
  h3 small { font: 700 12px var(--font); color: var(--faint); margin-left: auto; }
  .sub { color: var(--muted); font-size: 13.5px; line-height: 1.45; margin: 0 0 12px; }
  .center { text-align: center; }
  .row { display: flex; gap: 8px; margin-top: 10px; } .row > * { flex: 1; }
  .msg { text-align: center; min-height: 24px; font-weight: 800; font-size: 16px; margin: 10px 0; }

  /* ---------- Pastki navigatsiya ---------- */
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 2px; padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); background: rgba(11, 13, 18, .95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
  nav button { flex: 1; max-width: 120px; border: 0; background: none; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font: 700 10.5px var(--font); border-radius: 12px; transition: color .2s; }
  nav button svg { width: 22px; height: 22px; transition: transform .3s var(--ease); }
  nav button.on { color: var(--lime); }
  nav button.on svg { transform: translateY(-2px); }

  /* ---------- Tugmalar va boshqaruv ---------- */
  .btn { width: 100%; border: 0; border-radius: 14px; padding: 14px; background: var(--lime); color: var(--lime-ink); font: 800 16px var(--font); transition: transform .12s var(--ease), filter .2s, opacity .2s; }
  .btn:active { transform: scale(.97); filter: brightness(1.08); }
  .btn:disabled { opacity: .4; transform: none; }
  .btn.ghost { background: var(--panel-2); color: var(--text); }
  .btn.violet { background: var(--violet); color: #fff; }
  .btn.red { background: var(--red); color: #fff; }
  .btn.green { background: var(--green); color: #04240f; }
  .seg { display: flex; background: var(--panel); border-radius: 13px; padding: 4px; gap: 2px; margin-bottom: 10px; }
  .seg button { flex: 1; border: 0; background: none; color: var(--muted); padding: 9px 4px; border-radius: 10px; font: 800 13px var(--font); transition: background .25s var(--ease), color .2s; }
  .seg button.on { background: var(--panel-3); color: var(--text); }
  .inp { width: 100%; padding: 12px 14px; border-radius: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: 700 15px var(--font); outline: none; }
  .inp:focus { border-color: var(--lime); }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; }
  .chips button { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 7px 12px; border-radius: 99px; font: 800 12.5px var(--font); }
  .chips button.on { background: var(--text); color: var(--bg); }

  /* Tikish paneli */
  .bet { background: var(--panel); border-radius: 16px; padding: 10px; margin: 12px 0; }
  .bet .l { display: flex; gap: 8px; align-items: center; }
  .bet .l input { flex: 1; min-width: 0; text-align: center; font: 700 18px var(--display); color: var(--lime); background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 9px 6px; outline: none; }
  .bet .l button, .bet .q button { border: 0; background: var(--panel-2); color: var(--text); border-radius: 10px; font: 800 13px var(--font); }
  .bet .l button { width: 44px; height: 42px; font-size: 18px; }
  .bet .q { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .bet .q button { padding: 8px 0; color: var(--muted); }

  /* ---------- Keys kartalari ---------- */
  .cases { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 520px) { .cases { grid-template-columns: repeat(3, 1fr); } }
  .case { position: relative; border-radius: 18px; padding: 10px 10px 12px; text-align: center; overflow: hidden; background: radial-gradient(120% 80% at 50% 10%, color-mix(in oklab, var(--cc, #8b6cff) 40%, var(--panel)) 0%, var(--panel) 70%); animation: pageIn .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 25ms); transition: transform .15s var(--ease); }
  .case:active { transform: scale(.96); }
  .case .art { position: relative; height: 112px; display: grid; place-items: center; }
  .case .art img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 12px 14px rgba(0,0,0,.55)); transition: transform .45s var(--ease); }
  .case:active .art img { transform: translateY(-5px) rotate(-3deg) scale(1.04); }
  .case .art .b2, .case .art .b3 { position: absolute; width: 62%; opacity: .55; filter: blur(.4px) drop-shadow(0 8px 10px rgba(0,0,0,.5)); }
  .case .art .b2 { left: -6%; top: 6%; transform: rotate(-16deg); } .case .art .b3 { right: -6%; top: 2%; transform: rotate(14deg); }
  .case .art .b1 { position: relative; width: 86%; }
  .case .cn { font: 700 13px var(--display); letter-spacing: -0.01em; margin-top: 4px; line-height: 1.25; min-height: 32px; display: flex; align-items: center; justify-content: center; }
  .case .cp { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; background: rgba(196, 255, 61, .12); color: var(--lime); font: 700 12px var(--display); padding: 5px 10px; border-radius: 99px; }
  .case .cp.free { background: var(--lime); color: var(--lime-ink); }
  .case .tag { position: absolute; top: 9px; left: 9px; font: 800 9px var(--font); background: var(--red); color: #fff; padding: 2px 6px; border-radius: 6px; letter-spacing: .02em; }

  .hero { text-align: center; padding: 6px 0 2px; }
  .hero .art { height: 190px; display: grid; place-items: center; position: relative; }
  .hero .art img { max-height: 100%; max-width: 70%; filter: drop-shadow(0 18px 24px rgba(0,0,0,.6)); animation: floaty 3.2s ease-in-out infinite; }
  @keyframes floaty { 50% { transform: translateY(-8px); } }
  .cnt { display: flex; gap: 6px; justify-content: center; margin: 12px 0; }
  .cnt button { width: 52px; height: 40px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 12px; font: 800 14px var(--font); }
  .cnt button.on { background: var(--text); color: var(--bg); }

  /* ---------- Skin plitkalari (cs2.js bilan umumiy) ---------- */
  .skins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (min-width: 520px) { .skins { grid-template-columns: repeat(4, 1fr); } }
  .sk { position: relative; border-radius: 14px; padding: 8px 6px 9px; text-align: center; overflow: hidden; background: linear-gradient(180deg, var(--panel) 50%, color-mix(in oklab, var(--rc) 30%, var(--panel))); box-shadow: inset 0 -3px 0 var(--rc); transition: transform .15s var(--ease); }
  .sk:active { transform: scale(.96); }
  .sk img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; filter: drop-shadow(0 6px 8px rgba(0,0,0,.5)); }
  .sk .w { font-size: 10px; color: var(--muted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sk .f { font-size: 11.5px; font-weight: 800; line-height: 1.2; min-height: 28px; display: flex; align-items: center; justify-content: center; }
  .sk .pr { font: 700 11px var(--display); color: var(--lime); margin-top: 3px; }
  .sk .st { position: absolute; top: 6px; left: 6px; font-size: 9px; font-weight: 800; color: #ff8a3d; }
  .sk .ch { position: absolute; top: 6px; right: 6px; font-size: 9.5px; font-weight: 800; color: var(--muted); }
  .sk.sel { box-shadow: inset 0 0 0 2px var(--lime), inset 0 -3px 0 var(--rc); }
  .sk .sell { margin-top: 6px; width: 100%; border: 0; border-radius: 9px; padding: 6px 0; background: var(--panel-3); color: var(--text); font: 800 11px var(--font); }
  .strip { position: relative; overflow: hidden; border-radius: 16px; background: var(--panel); padding: 10px 0; margin: 10px 0; -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); }
  .track { display: flex; gap: 8px; will-change: transform; padding-left: 8px; }
  .track .sk { flex: 0 0 104px; }
  .marker { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--lime); border-radius: 3px; z-index: 2; }
  .marker::before, .marker::after { content: ""; position: absolute; left: 50%; margin-left: -7px; border: 7px solid transparent; }
  .marker::before { top: 0; border-top-color: var(--lime); } .marker::after { bottom: 0; border-bottom-color: var(--lime); }
  .win-sk { animation: winPop .6s var(--ease) both; }
  @keyframes winPop { from { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.06); } }
  /* Keys jangi */
  .bt-cols { display: grid; gap: 8px; }
  .bt-col { background: var(--panel); border-radius: 14px; padding: 8px; text-align: center; transition: box-shadow .3s; }
  .bt-col.win { box-shadow: inset 0 0 0 2px var(--lime); }
  .bt-col .who { font-weight: 800; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bt-col .sum { font: 700 13px var(--display); color: var(--lime); margin: 2px 0 6px; }
  .vstrip { position: relative; height: 128px; overflow: hidden; border-radius: 12px; background: var(--panel-2); -webkit-mask-image: linear-gradient(180deg, transparent, #000 25%, #000 75%, transparent); mask-image: linear-gradient(180deg, transparent, #000 25%, #000 75%, transparent); }
  .vtrack { display: flex; flex-direction: column; gap: 6px; will-change: transform; }
  .vtrack .sk { flex: 0 0 118px; padding: 4px; }
  .vstrip .hline { position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: var(--lime); z-index: 2; }
  .bt-got { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 6px; min-height: 30px; }
  .bt-got img { width: 38px; height: 28px; object-fit: contain; border-bottom: 2px solid var(--rc); }
  .loader { text-align: center; color: var(--muted); padding: 60px 0; }
  .loader i { display: block; width: 34px; height: 34px; margin: 0 auto 12px; border-radius: 50%; border: 3px solid var(--panel-3); border-top-color: var(--lime); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- O'yinlar ---------- */
  .games { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .gm { position: relative; border-radius: 18px; padding: 16px 14px; min-height: 118px; overflow: hidden; background: linear-gradient(150deg, color-mix(in oklab, var(--gc) 45%, var(--panel)), var(--panel) 75%); animation: pageIn .4s var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms); }
  .gm:active { transform: scale(.97); }
  .gm .t { font: 700 16px var(--display); letter-spacing: -0.01em; }
  .gm .d { font-size: 12px; color: rgba(238,241,247,.75); margin-top: 4px; max-width: 70%; line-height: 1.35; }
  .gm svg { position: absolute; right: -8px; bottom: -8px; width: 74px; height: 74px; opacity: .9; }
  canvas { display: block; margin: 0 auto; border-radius: 16px; background: var(--panel); touch-action: none; }
  .cells { display: grid; gap: 6px; margin: 8px auto; }
  .cell { border: 0; border-radius: 12px; background: var(--panel-2); color: var(--text); aspect-ratio: 1; font-size: 24px; display: grid; place-items: center; transition: transform .12s var(--ease), background .2s; }
  .cell:active { transform: scale(.94); }
  .cell.ok { background: color-mix(in oklab, var(--green) 30%, var(--panel-2)); animation: winPop .35s var(--ease); }
  .cell.bad { background: color-mix(in oklab, var(--red) 40%, var(--panel-2)); animation: winPop .35s var(--ease); }
  .cell.dim { opacity: .35; }
  .floors { display: flex; flex-direction: column-reverse; gap: 6px; }
  .floor { display: grid; gap: 6px; align-items: center; grid-template-columns: 64px repeat(var(--n), 1fr); transition: opacity .3s; }
  .floor .m { font: 700 12px var(--display); color: var(--muted); text-align: right; padding-right: 4px; }
  .floor.act .m { color: var(--lime); }
  .floor .cell { aspect-ratio: auto; height: 44px; font-size: 20px; }
  .floor:not(.act) .cell:not(.ok):not(.bad) { opacity: .45; }
  .rstrip { position: relative; overflow: hidden; border-radius: 16px; background: var(--panel); padding: 10px 0; -webkit-mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); }
  .rtrack { display: flex; gap: 6px; padding-left: 6px; will-change: transform; }
  .rtrack span { flex: 0 0 54px; height: 54px; border-radius: 12px; display: grid; place-items: center; font: 700 13px var(--display); color: #fff; }
  .ropts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .ropts button { border: 0; border-radius: 13px; padding: 12px 4px; font: 800 13px var(--font); color: #fff; box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .2s, transform .12s; }
  .ropts button.on { box-shadow: inset 0 0 0 3px var(--text); }
  .ropts button small { display: block; font-size: 11px; opacity: .8; }
  .up-ring { position: relative; width: 200px; height: 200px; margin: 8px auto; }
  .up-ring svg.r { width: 100%; height: 100%; transform: rotate(-90deg); }
  .up-ring .arrow { position: absolute; inset: 0; display: grid; place-items: start center; }
  .up-ring .arrow i { width: 4px; height: 28px; margin-top: 2px; border-radius: 3px; background: var(--text); box-shadow: 0 0 0 2px var(--bg); }
  .up-ring .pc { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font: 700 28px var(--display); }
  .up-ring .pc small { display: block; font: 700 11px var(--font); color: var(--muted); }
  .slots { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
  .slot { border-radius: 14px; background: var(--panel); min-height: 128px; display: grid; place-items: center; padding: 8px; text-align: center; color: var(--faint); font-size: 12.5px; }
  .tbar { position: relative; height: 46px; border-radius: 12px; background: var(--panel-2); overflow: hidden; margin: 12px 0; }
  .tbar .z { position: absolute; top: 0; bottom: 0; left: 0; background: color-mix(in oklab, var(--green) 55%, transparent); }
  .tbar .p { position: absolute; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: var(--text); left: 0; box-shadow: 0 0 0 2px var(--bg); }
  .slider { width: 100%; accent-color: var(--lime); }

  /* ---------- Bonuslar ---------- */
  .card { background: var(--panel); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .prog { height: 10px; border-radius: 9px; background: var(--panel-3); overflow: hidden; margin: 8px 0; }
  .prog i { display: block; height: 100%; background: var(--lime); border-radius: 9px; transition: width .6s var(--ease); }
  .lvls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .lvl { border-radius: 12px; background: var(--panel-2); padding: 8px 4px; text-align: center; font-size: 11px; color: var(--muted); }
  .lvl b { display: block; font: 700 14px var(--display); color: var(--text); }
  .lvl.can { background: color-mix(in oklab, var(--lime) 25%, var(--panel-2)); color: var(--text); animation: pulse 1.6s infinite; }
  .lvl.got { opacity: .45; }
  .task { display: flex; align-items: center; gap: 10px; }
  .task .tx { flex: 1; } .task .tx div { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .task button { width: auto; padding: 9px 12px; font-size: 13px; }
  .boss { text-align: center; font-size: 110px; line-height: 1.1; filter: drop-shadow(0 16px 24px rgba(255,77,94,.25)); }
  .boss.hit { animation: hit .3s; }
  @keyframes hit { 30% { transform: translateX(-8px) rotate(-4deg); filter: brightness(2); } 60% { transform: translateX(6px); } }
  .hp { height: 16px; border-radius: 9px; background: var(--panel-3); overflow: hidden; }
  .hp i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), #ff8a3d); transition: width .8s var(--ease); }

  .overlay { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); display: none; align-items: flex-end; justify-content: center; }
  .overlay.on { display: flex; }
  .sheet { width: 100%; max-width: 640px; background: var(--panel); border-radius: 24px 24px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 86vh; overflow-y: auto; animation: sheetUp .45s var(--ease); }
  @keyframes sheetUp { from { transform: translateY(100%); } }
  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--panel-3); color: var(--text); padding: 11px 16px; border-radius: 14px; font-size: 14px; font-weight: 700; z-index: 60; max-width: 90vw; text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s, transform .35s var(--ease); box-shadow: var(--shadow); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; background: none; border-radius: 0; }

"use strict";
/* ---------- Umumiy yadro (O'yin markazi bilan bir xil saqlash kalitlari) ---------- */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#0b0d12"); tg.setBackgroundColor("#0b0d12"); } catch (e) {} }
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);
const haptic = (t) => { try { if (!tg || !tg.HapticFeedback) return; if (t === "ok") tg.HapticFeedback.notificationOccurred("success"); else if (t === "bad") tg.HapticFeedback.notificationOccurred("error"); else tg.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} };
function toast(text, ms = 2200) { const t = $("toast"); t.textContent = text; t.classList.add("on"); clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.remove("on"), ms); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const G = { add() {} }; // cs2.js dagi O'yin markazi o'yinlari bu sahifada kerak emas
let RATE = 12000;
const Chips = {
  get() { let v = store("chips"); if (typeof v !== "number") { v = 1000; store("chips", v); } return v; },
  set(v) { store("chips", Math.max(0, Math.floor(v))); this.paint(); },
  add(n) { this.set(this.get() + n); },
  take(n) { if (n <= 0 || n > this.get()) { toast("Balans yetarli emas"); haptic("bad"); return false; } this.add(-n); return true; },
  paint() { const el = $("bal"); if (el) el.textContent = som(this.get() / 100); },
};
/* So'm formati */
function som(usd) { const v = Math.round(usd * RATE); return v >= 1e6 ? (v / 1e6).toFixed(v >= 1e7 ? 0 : 1).replace(".0", "") + " mln so'm" : v.toLocaleString("ru-RU") + " so'm"; }
const Confetti = (() => {
  const c = $("fx"), ctx = c.getContext("2d"); let ps = [], raf = 0, last = 0;
  const size = () => { const d = window.devicePixelRatio || 1; c.width = innerWidth * d; c.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
  addEventListener("resize", size); size();
  const COLS = ["#c4ff3d", "#8b6cff", "#ffc542", "#ff4d5e", "#eef1f7"];
  const loop = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps = ps.filter((p) => (p.life -= dt) > 0 && p.y < innerHeight + 20);
    for (const p of ps) { p.vy += 520 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }
    if (ps.length) raf = requestAnimationFrame(loop); else { raf = 0; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  };
  return { fire(n = 90) { if (REDUCED) n = 12; for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.9, s = 380 + Math.random() * 420; ps.push({ x: innerWidth / 2, y: innerHeight * 0.6, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 0, vr: (Math.random() - 0.5) * 14, w: 7 + Math.random() * 5, h: 4 + Math.random() * 4, life: 2.4 + Math.random(), color: pick(COLS) }); } if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } } };
})();
function floatText(el, text, color = "#c4ff3d") { const r = el.getBoundingClientRect(), d = document.createElement("div"); d.className = "float"; d.textContent = text; d.style.color = color; d.style.left = r.left + r.width / 2 - 30 + "px"; d.style.top = r.top - 4 + "px"; document.body.appendChild(d); setTimeout(() => d.remove(), 950); }
function shakeEl(el) { if (REDUCED || !el.animate) return; el.animate([{ transform: "translateX(-7px)" }, { transform: "translateX(6px)" }, { transform: "translateX(-3px)" }, { transform: "none" }], { duration: 320 }); }
$("toHub").onclick = () => { location.href = "index.html"; };
if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(() => (location.href = "index.html")); }
</script>
