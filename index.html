<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>O'yin markazi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1222);
    --card: var(--tg-theme-secondary-bg-color, #1a1f38);
    --text: var(--tg-theme-text-color, #f2f4ff);
    --hint: var(--tg-theme-hint-color, #8b92b8);
    --accent: var(--tg-theme-button-color, #6c5ce7);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --good: #2ecc71; --bad: #ff5e6c; --warn: #ffc048; --gold: #f5c542;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  .screen { display: none; min-height: 100vh; padding: 14px 16px 24px; max-width: 540px; margin: 0 auto; }
  .screen.on { display: block; }
  h1 { font-size: 22px; margin: 2px 0; }
  .sub { color: var(--hint); font-size: 14px; margin-bottom: 12px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; border: 0; background: var(--card); color: var(--text); padding: 8px 14px; border-radius: 99px; font-weight: 700; font-size: 14px; }
  .tabs button.on { background: var(--accent); color: var(--accent-text); }
  .search { width: 100%; padding: 11px 14px; border-radius: 12px; border: 0; background: var(--card); color: var(--text); font-size: 15px; margin-bottom: 10px; outline: none; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .gc { background: var(--card); border-radius: 14px; padding: 12px 6px 10px; text-align: center; cursor: pointer; border: 1px solid rgba(127,127,127,.12); transition: transform .12s; position: relative; }
  .gc:active { transform: scale(.94); }
  .gc .ico { font-size: 32px; line-height: 1.1; }
  .gc .nm { font-weight: 700; font-size: 12.5px; margin-top: 6px; line-height: 1.2; }
  .gc .bs { font-size: 10.5px; color: var(--warn); margin-top: 3px; min-height: 12px; }
  .gc .tag { position: absolute; top: 6px; right: 6px; font-size: 9px; font-weight: 800; background: var(--bad); color: #fff; padding: 1px 5px; border-radius: 6px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .topbar .t { font-weight: 700; font-size: 16px; text-align: center; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { background: var(--card); padding: 6px 12px; border-radius: 99px; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .pill.gold { color: var(--gold); }
  .btn { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 12px; padding: 12px 16px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; }
  .btn.ghost { background: var(--card); color: var(--text); }
  .btn.good { background: var(--good); color: #fff; } .btn.bad { background: var(--bad); color: #fff; }
  .btn:active { opacity: .8; } .btn:disabled { opacity: .45; }
  .back { background: var(--card); color: var(--text); border: 0; border-radius: 10px; padding: 8px 12px; font-size: 15px; cursor: pointer; }
  canvas { display: block; margin: 0 auto; background: var(--card); border-radius: 12px; touch-action: none; }
  .center { text-align: center; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .row > * { flex: 1; }
  .msg { text-align: center; min-height: 26px; font-weight: 700; font-size: 17px; margin: 8px 0; }
  .big { font-size: 40px; font-weight: 800; text-align: center; margin: 18px 0; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opts button, .cell { border: 0; border-radius: 14px; background: var(--card); color: var(--text); font-weight: 700; font-size: 18px; padding: 16px 8px; cursor: pointer; }
  .opts button.ok { background: var(--good); color: #fff; } .opts button.no { background: var(--bad); color: #fff; }
  .bar { height: 8px; background: var(--card); border-radius: 9px; overflow: hidden; margin-bottom: 6px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 100%; transition: width .1s linear; }
  .board { display: grid; gap: 6px; margin: 8px auto; }
  .board .cell { padding: 0; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .dpad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 52px); gap: 8px; justify-content: center; margin-top: 12px; }
  .dpad button { background: var(--card); color: var(--text); border: 0; border-radius: 12px; font-size: 22px; }
  .dpad button:active { background: var(--accent); }
  .seg { display: flex; background: var(--card); border-radius: 12px; padding: 4px; margin-bottom: 8px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--hint); padding: 9px; border-radius: 9px; font-weight: 700; font-size: 14px; }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  input.ans { width: 100%; padding: 14px; font-size: 22px; text-align: center; border-radius: 12px; border: 2px solid var(--accent); background: var(--card); color: var(--text); outline: none; }
  /* Xotira kartalari */
  .mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 380px; margin: 0 auto; perspective: 600px; }
  .mc { aspect-ratio: 1; position: relative; transform-style: preserve-3d; transition: transform .35s; cursor: pointer; }
  .mc.open, .mc.done { transform: rotateY(180deg); }
  .mc > div { position: absolute; inset: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; }
  .mc .f { background: linear-gradient(135deg, var(--accent), #a29bfe); font-size: 22px; color: #fff; }
  .mc .b { background: var(--card); transform: rotateY(180deg); font-size: 32px; }
  .mc.done .b { background: rgba(46,204,113,.22); }
  /* Kazino */
  .bet { background: var(--card); border-radius: 14px; padding: 10px; margin-top: 12px; }
  .bet .line { display: flex; align-items: center; gap: 8px; }
  .bet .line button { border: 0; background: var(--bg); color: var(--text); border-radius: 10px; padding: 9px 12px; font-weight: 800; font-size: 15px; }
  .bet .val { flex: 1; text-align: center; font-size: 20px; font-weight: 800; color: var(--gold); }
  .bet .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .bet .quick button { border: 0; background: var(--bg); color: var(--text); border-radius: 9px; padding: 7px 0; font-weight: 700; font-size: 13px; }
  .pcard { display: inline-flex; width: 52px; height: 74px; border-radius: 8px; background: #fff; color: #222; font-weight: 800; font-size: 18px; align-items: center; justify-content: center; margin: 3px; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .pcard.red { color: #d63031; } .pcard.back { background: linear-gradient(135deg, #6c5ce7, #e84393); color: transparent; }
  .reels { display: flex; justify-content: center; gap: 8px; margin: 16px 0; }
  .reel { width: 76px; height: 86px; background: var(--card); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 46px; border: 2px solid rgba(245,197,66,.4); }
  /* Natija oynasi */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .overlay.on { display: flex; }
  .modal { background: var(--bg); border-radius: 22px; padding: 22px 18px; width: 100%; max-width: 360px; text-align: center; border: 1px solid rgba(127,127,127,.2); animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  .modal .bigi { font-size: 52px; }
  .modal h2 { margin: 6px 0; }
  .modal .coins { font-size: 22px; font-weight: 800; color: var(--warn); margin: 10px 0 4px; }
  .modal .note { color: var(--hint); font-size: 13px; margin-bottom: 14px; }
  .modal .btn + .btn { margin-top: 10px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(20,20,30,.9); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; display: none; z-index: 20; max-width: 90vw; text-align: center; }
</style>
</head>
<body>

<section class="screen on" id="home">
  <div class="head">
    <div><h1>🎮 O'yin markazi</h1><div class="sub" id="hello"></div></div>
    <div class="pill gold" id="chipsTop" title="Kazino fishkalari"></div>
  </div>
  <input class="search" id="search" placeholder="🔍 O'yin qidirish...">
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="cards"></div>
</section>

<section class="screen" id="play">
  <div class="topbar">
    <button class="back" id="backBtn">←</button>
    <div class="t" id="gTitle"></div>
    <div class="pill" id="gScore"></div>
  </div>
  <div id="stage"></div>
</section>

<div class="overlay" id="result">
  <div class="modal">
    <div class="bigi" id="rIcon">🏆</div>
    <h2 id="rTitle"></h2>
    <div id="rText"></div>
    <div class="coins" id="rCoins"></div>
    <div class="note" id="rNote">Tangalar bot hisobingizga qo'shiladi</div>
    <button class="btn" id="rClaim">🎁 Tangani olish</button>
    <button class="btn ghost" id="rAgain">🔁 Yana o'ynash</button>
    <button class="btn ghost" id="rHome">🏠 Bosh sahifa</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =====================================================================
   YADRO: Telegram, yordamchilar, o'yinlar ro'yxati, natija oynasi
   ===================================================================== */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const BOT = new URLSearchParams(location.search).get("bot") || "qiziqdim_bot";
const $ = (id) => document.getElementById(id);
const haptic = (t) => { try { if (!tg || !tg.HapticFeedback) return; if (t === "ok") tg.HapticFeedback.notificationOccurred("success"); else if (t === "bad") tg.HapticFeedback.notificationOccurred("error"); else tg.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} };
function toast(text, ms = 2200) { const t = $("toast"); t.textContent = text; t.style.display = "block"; clearTimeout(toast._h); toast._h = setTimeout(() => (t.style.display = "none"), ms); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const G = {
  list: [],
  add(g) { this.list.push(Object.assign({ cat: "arcade", max: 150, ds: "" }, g)); },
};
const CATS = [["all", "🔥 Hammasi"], ["arcade", "🕹 Arkada"], ["puzzle", "🧩 Boshqotirma"], ["brain", "🧠 Aql"], ["speed", "⚡ Tezlik"], ["casino", "🎰 Kazino"]];

/* ---------- Kazino fishkalari (faqat o'yin uchun, tangaga almashtirilmaydi) ---------- */
const Chips = {
  get() { let v = store("chips"); if (typeof v !== "number") { v = 1000; store("chips", v); } return v; },
  set(v) { store("chips", Math.max(0, Math.floor(v))); this.paint(); },
  add(n) { this.set(this.get() + n); },
  take(n) { if (n <= 0 || n > this.get()) { toast("🎰 Fishka yetarli emas!"); haptic("bad"); return false; } this.add(-n); return true; },
  paint() { const v = this.get().toLocaleString("ru-RU"); $("chipsTop").textContent = `🎰 ${v}`; if (current && GMAP[current].cat === "casino") setScore(`🎰 ${v}`); },
};

/* ---------- Bosh sahifa ---------- */
let cat = store("cat") || "all", query = "";
const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
function renderHome() {
  $("hello").textContent = `${user ? user.first_name + ", " : ""}${G.list.length} ta o'yin sizni kutmoqda!`;
  $("tabs").innerHTML = CATS.map(([k, n]) => `<button data-c="${k}" class="${k === cat ? "on" : ""}">${n}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach((b) => (b.onclick = () => { cat = b.dataset.c; store("cat", cat); renderHome(); }));
  const q = query.trim().toLowerCase();
  const list = G.list.filter((g) => (cat === "all" || g.cat === cat) && (!q || g.nm.toLowerCase().includes(q)));
  $("cards").innerHTML = list.map((g) => {
    const b = store("best_" + g.id);
    return `<div class="gc" data-g="${g.id}">${g.tag ? `<span class="tag">${g.tag}</span>` : ""}<div class="ico">${g.ico}</div><div class="nm">${g.nm}</div><div class="bs">${b != null ? "🏅 " + b + (g.unit || "") : ""}</div></div>`;
  }).join("") || `<div class="sub">Hech narsa topilmadi</div>`;
  $("cards").querySelectorAll(".gc").forEach((c) => (c.onclick = () => openGame(c.dataset.g)));
  Chips.paint();
}
$("search").oninput = (e) => { query = e.target.value; renderHome(); };

/* ---------- O'yin ekrani ---------- */
let current = null, cleanup = null, lastResult = null, GMAP = {};
function setScore(t) { $("gScore").textContent = t; }
function saveBest(id, val, lower) {
  const b = store("best_" + id);
  if (b == null || (lower ? val < b : val > b)) { store("best_" + id, val); return true; }
  return false;
}
function openGame(id) {
  stopGame(); hideResult();
  current = id;
  const g = GMAP[id];
  $("gTitle").textContent = `${g.ico} ${g.nm}`;
  setScore("");
  $("home").classList.remove("on"); $("play").classList.add("on");
  const stage = $("stage"); stage.innerHTML = "";
  if (g.ds) { const d = document.createElement("div"); d.className = "sub center"; d.textContent = g.ds; stage.appendChild(d); }
  if (tg && tg.BackButton) tg.BackButton.show();
  window.scrollTo(0, 0);
  if (g.cat === "casino") Chips.paint();
  try { cleanup = g.start(stage, makeApi(g, stage)) || null; } catch (e) { console.error(e); toast("Xatolik: " + e.message); }
}
function stopGame() { if (cleanup) { try { cleanup(); } catch (e) {} } cleanup = null; }
function goHome() {
  stopGame(); hideResult(); current = null;
  $("play").classList.remove("on"); $("home").classList.add("on");
  if (tg && tg.BackButton) tg.BackButton.hide();
  renderHome();
}
$("backBtn").onclick = goHome;
if (tg && tg.BackButton) tg.BackButton.onClick(goHome);

/* ---------- O'yinlar uchun API ---------- */
function makeApi(g, stage) {
  const api = {
    score: setScore, haptic, toast, rnd, pick, shuffle, sleep, clamp,
    width: () => Math.min(stage.clientWidth || 360, 480),
    best: (val, lower) => saveBest(g.id, val, lower),
    el(html, cls = "") { const d = document.createElement("div"); if (cls) d.className = cls; d.innerHTML = html; stage.appendChild(d); return d; },
    canvas(w, h) {
      const c = document.createElement("canvas"); const dpr = window.devicePixelRatio || 1;
      c.width = w * dpr; c.height = h * dpr; c.style.width = w + "px"; c.style.height = h + "px";
      const ctx = c.getContext("2d"); ctx.scale(dpr, dpr); stage.appendChild(c); return { c, ctx };
    },
    /* requestAnimationFrame sikli: fn(dt) false qaytarsa to'xtaydi */
    loop(fn) {
      let raf = 0, last = performance.now(), alive = true;
      const f = (now) => { if (!alive) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; if (fn(dt) === false) { alive = false; return; } raf = requestAnimationFrame(f); };
      raf = requestAnimationFrame(f);
      return () => { alive = false; cancelAnimationFrame(raf); };
    },
    /* Kanvas ustida barmoq / sichqoncha koordinatalari */
    pointer(c, cb) {
      const h = (e) => { const r = c.getBoundingClientRect(); cb(e.clientX - r.left, e.clientY - r.top, e.type); };
      c.addEventListener("pointerdown", h); c.addEventListener("pointermove", (e) => (e.buttons || e.pointerType === "touch") && h(e));
    },
    keys(map) { const k = (e) => { if (map[e.key]) { e.preventDefault(); map[e.key](); } }; document.addEventListener("keydown", k); return () => document.removeEventListener("keydown", k); },
    /* O'yin tugashi: coins — botga beriladigan tanga (g.max bilan cheklanadi) */
    end({ icon = "🏆", title = "O'yin tugadi", text = "", coins = 0 }) {
      if (current !== g.id) return;
      const c = clamp(Math.round(coins || 0), 0, g.max);
      lastResult = c > 0 ? { g: g.id, c } : null;
      $("rIcon").textContent = icon; $("rTitle").textContent = title; $("rText").innerHTML = text;
      $("rCoins").textContent = c > 0 ? `+${c} 🪙` : "";
      $("rClaim").style.display = $("rNote").style.display = c > 0 ? "block" : "none";
      $("result").classList.add("on");
      haptic(c > 0 ? "ok" : "bad");
    },
    /* Kazino: tikish paneli */
    bet(parent, onChange) {
      let v = clamp(store("bet") || 50, 10, 1e9);
      const d = document.createElement("div"); d.className = "bet";
      d.innerHTML = `<div class="line"><button data-a="-">−</button><div class="val"></div><button data-a="+">+</button></div>
        <div class="quick"><button data-q="10">10</button><button data-q="half">½</button><button data-q="x2">×2</button><button data-q="max">MAX</button></div>
        <div class="row" style="margin-top:8px"><button class="btn ghost" data-a="free" style="display:none;padding:9px;font-size:14px">🎁 Bepul 1000 fishka</button></div>`;
      (parent || stage).appendChild(d);
      const paint = () => {
        v = clamp(Math.floor(v), 10, Math.max(10, Chips.get())); store("bet", v);
        d.querySelector(".val").textContent = `🎰 ${v}`;
        const ts = store("chips_ts") || 0;
        d.querySelector('[data-a="free"]').style.display = Chips.get() < 10 && Date.now() - ts > 600000 ? "block" : "none";
        onChange && onChange(v);
      };
      const step = () => (v < 100 ? 10 : v < 1000 ? 50 : 500);
      d.querySelectorAll("button").forEach((b) => (b.onclick = () => {
        haptic("light");
        const a = b.dataset.a, q = b.dataset.q;
        if (a === "+") v += step(); else if (a === "-") v -= step();
        else if (a === "free") { store("chips_ts", Date.now()); Chips.add(1000); toast("🎁 +1000 fishka!"); }
        else if (q === "half") v = v / 2; else if (q === "x2") v *= 2; else if (q === "max") v = Chips.get(); else if (q) v = +q;
        paint();
      }));
      paint();
      return { get: () => v, paint };
    },
  };
  return api;
}

/* ---------- Natija oynasi ---------- */
function hideResult() { $("result").classList.remove("on"); }
$("rAgain").onclick = () => { hideResult(); openGame(current); };
$("rHome").onclick = goHome;
$("rClaim").onclick = () => {
  if (!lastResult) return;
  if (!(tg && tg.initData)) return toast("Tanga olish uchun o'yinni Telegram'dagi @" + BOT + " orqali oching", 3500);
  // Pastki klaviatura tugmasi orqali ochilgan bo'lsa (query_id yo'q) — sendData ishlaydi
  if (!(tg.initDataUnsafe && tg.initDataUnsafe.query_id)) {
    try { tg.sendData(JSON.stringify(lastResult)); return; } catch (e) {}
  }
  // "Open" / menyu tugmasi orqali — natija /start havolasi orqali botga boradi
  tg.openTelegramLink(`https://t.me/${BOT}?start=g-${lastResult.g}-${lastResult.c}`);
  setTimeout(() => tg.close(), 300);
};
</script>
<script src="js/arcade.js"></script>
<script src="js/puzzle.js"></script>
<script src="js/brain.js"></script>
<script src="js/casino.js"></script>
<script>
  G.list.forEach((g) => (GMAP[g.id] = g));
  renderHome();
</script>
</body>
</html>
